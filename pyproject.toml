[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
name = "zspace"
description = "Toy Model for Creating QuAC in a latent space."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
  "Programming Language :: Python :: 3",
]
keywords = []
license = { text = "BSD 3-Clause License" }
authors = [
    { email = "barrosg@hhmi.org ", name = "Gabriela Barros " },
    { email = "adjavond@hhmi.org", name = "Diane Adjavon" }
]
dynamic = ["version"]
dependencies = ["ipykernel>=6.29.5,<7", "torch>=2.7.0,<3", "numpy>=2.2.6,<3", "pytest>=8.4.0,<9"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
zspace = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
tqdm = ">=4.67.1,<5"
